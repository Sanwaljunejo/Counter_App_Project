<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/index.css">
    <title>BacketBall SkateBoard</title>
</head>
<body>
    <div class="container">
        <div class="home">
        <h2>HOME</h2>
            <h1 id="sum-el" class="sum">0</h1>
            <div class="buttons">
            <button id="plus-one" class="btn">+1</button>
            <button id="plus-two" class="btn">+2</button>
            <button id="plus-three" class="btn">+3</button>
            </div>
        </div>
        <button id="reset-btn">START GAME</button>
        <div class="guest">
        <h2>GUEST</h2>
            <h1 id="sum-g-el" class="sum">0</h1>
            <div class="buttons">
            <button id="plus-g-one" class="btn">+1</button>
            <button id="plus-g-two" class="btn">+2</button>
            <button id="plus-g-three" class="btn">+3</button>
            </div>
        </div>
    </div>
    <script src="/index.js"></script>
</body>
</html>
